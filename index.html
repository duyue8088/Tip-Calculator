<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tip Calculator</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, "Times New Roman", serif;
      background: #f3efe8;
      color: #2c2a28;
    }

    .card {
      width: min(420px, calc(100% - 2rem));
      padding: 2rem;
      background: #fffaf4;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(60, 40, 20, 0.12);
    }

    h1 {
      margin: 0 0 1.5rem;
      font-size: 1.75rem;
      font-weight: 600;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.95rem;
    }

    input,
    select,
    button {
      width: 100%;
      margin-bottom: 1rem;
      padding: 0.7rem 0.8rem;
      font: inherit;
      border: 1px solid #d9d0c5;
      border-radius: 8px;
      background: #fff;
    }

    button {
      margin-top: 0.25rem;
      margin-bottom: 0;
      cursor: pointer;
      background: #3d5a40;
      color: #fff;
      border: none;
    }

    #result {
      margin-top: 1.25rem;
      min-height: 1.5rem;
      line-height: 1.6;
    }

    #result.error {
      color: #8a2f2f;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Tip Calculator</h1>
    <!-- input for bill amount, dropdown for tip percent 10 15 20, number of people, a Calculate button, and a result area -->
    <label for="bill">Bill amount</label>
    <input type="number" id="bill" name="bill" min="0" step="0.01">

    <label for="tip">Tip percent</label>
    <select id="tip" name="tip">
      <option value="10">10%</option>
      <option value="15">15%</option>
      <option value="20">20%</option>
    </select>

    <label for="people">Number of people</label>
    <input type="number" id="people" name="people" min="1" step="1" value="1">

    <button type="button" id="calculate">Calculate</button>

    <div id="result"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
